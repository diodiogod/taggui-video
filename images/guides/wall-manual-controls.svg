<text x="573" y="536" font-family="Arial" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">C</text>
<text x="76" y="698" font-family="Arial" font-size="22" font-weight="700" fill="#12233b" text-anchor="start">Alt may be released before the mouse.</text>
<text x="76" y="733" font-family="Arial" font-size="20" font-weight="400" fill="#52657d" text-anchor="start">Moving a window alone never triggers reflow.</text>
<text x="836" y="211" font-family="Arial" font-size="30" font-weight="700" fill="#12233b" text-anchor="start">Toggle Manual Wall Layout</text>
<rect x="836" y="251" width="136" height="78" rx="12" fill="#d3dbe8"/>
<rect x="836" y="246" width="136" height="78" rx="12" fill="#ffffff" stroke="#9aacbf" stroke-width="2"/>
<text x="904.0" y="295.0" font-family="Arial" font-size="29" font-weight="700" fill="#12233b" text-anchor="middle">Ctrl</text>
<rect x="1010" y="251" width="126" height="78" rx="12" fill="#d3dbe8"/>
<rect x="1010" y="246" width="126" height="78" rx="12" fill="#ffffff" stroke="#9aacbf" stroke-width="2"/>
<text x="1073.0" y="295.0" font-family="Arial" font-size="29" font-weight="700" fill="#12233b" text-anchor="middle">Alt</text>
<rect x="1174" y="251" width="94" height="78" rx="12" fill="#d3dbe8"/>
<rect x="1174" y="246" width="94" height="78" rx="12" fill="#ffffff" stroke="#9aacbf" stroke-width="2"/>
<text x="1221.0" y="295.0" font-family="Arial" font-size="29" font-weight="700" fill="#12233b" text-anchor="middle">M</text>
<text x="986" y="297" font-family="Arial" font-size="29" font-weight="400" fill="#52657d" text-anchor="middle">+</text>
<text x="1154" y="297" font-family="Arial" font-size="29" font-weight="400" fill="#52657d" text-anchor="middle">+</text>
<rect x="1290" y="265" width="166" height="44" rx="22" fill="#e4edf8"/>
<text x="1373.0" y="294" font-family="Arial" font-size="18" font-weight="700" fill="#12233b" text-anchor="middle">Configurable</text>
<text x="836" y="373" font-family="Arial" font-size="23" font-weight="700" fill="#12233b" text-anchor="start">Make several adjustments at your own pace.</text>
<text x="836" y="408" font-family="Arial" font-size="22" font-weight="400" fill="#52657d" text-anchor="start">Automatic rearrangement stays suspended.</text>
<rect x="836" y="451" width="624" height="90" rx="12" fill="#e4edf8"/>
<text x="860" y="505" font-family="Arial" font-size="26" font-weight="700" fill="#12233b" text-anchor="start">Manual Wall Layout</text>
<rect x="1310" y="475" width="126" height="42" rx="21" fill="#158067"/>
<text x="1334" y="503" font-family="Arial" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start">ON</text>
<circle cx="1413" cy="496" r="15" fill="#ffffff"/>
<text x="836" y="584" font-family="Arial" font-size="24" font-weight="700" fill="#12233b" text-anchor="start">Toggle it off when you are ready.</text>
<text x="836" y="619" font-family="Arial" font-size="22" font-weight="400" fill="#52657d" text-anchor="start">Automatic reflow resumes on the next resize.</text>
<text x="836" y="698" font-family="Arial" font-size="21" font-weight="700" fill="#12233b" text-anchor="start">Repack current wall works even in manual mode.</text>
<text x="836" y="733" font-family="Arial" font-size="20" font-weight="400" fill="#52657d" text-anchor="start">Use the wall menu for a deliberate repack.</text>
<text x="44" y="818" font-family="Arial" font-size="20" font-weight="400" fill="#52657d" text-anchor="start">Illustrated examples. Default shortcut: Ctrl+Alt+M. Shift still controls aspect preservation.</text>
</svg>