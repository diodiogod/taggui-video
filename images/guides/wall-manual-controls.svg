<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="850" viewBox="0 0 1536 850">
<rect width="1536" height="850" fill="#f6f8fc"/>
<text x="44" y="70" font-family="Arial" font-size="40" font-weight="700" fill="#12233b" text-anchor="start">Take manual control.</text>
<text x="44" y="108" font-family="Arial" font-size="21" font-weight="400" fill="#52657d" text-anchor="start">Use a one-gesture bypass or leave Manual Wall Layout on for several adjustments.</text>
<rect x="44" y="160" width="688" height="608" rx="18" fill="#ffffff" stroke="#dce4ee" stroke-width="2"/>
<rect x="804" y="160" width="688" height="608" rx="18" fill="#ffffff" stroke="#dce4ee" stroke-width="2"/>
<text x="76" y="211" font-family="Arial" font-size="30" font-weight="700" fill="#12233b" text-anchor="start">Hold Alt for one gesture</text>
<rect x="76" y="251" width="134" height="78" rx="12" fill="#d3dbe8"/>
<rect x="76" y="246" width="134" height="78" rx="12" fill="#ffffff" stroke="#9aacbf" stroke-width="2"/>
<text x="143.0" y="295.0" font-family="Arial" font-size="29" font-weight="700" fill="#12233b" text-anchor="middle">Alt</text>
<text x="236" y="278" font-family="Arial" font-size="23" font-weight="700" fill="#12233b" text-anchor="start">+ drag to move or resize</text>
<text x="236" y="309" font-family="Arial" font-size="20" font-weight="400" fill="#52657d" text-anchor="start">Skip automatic reflow for this gesture.</text>
<text x="76" y="373" font-family="Arial" font-size="24" font-weight="700" fill="#12233b" text-anchor="start">Only the window you adjust changes.</text>
<text x="76" y="408" font-family="Arial" font-size="22" font-weight="400" fill="#52657d" text-anchor="start">Its new size is remembered.</text>
<rect x="76" y="438" width="624" height="214" rx="18" fill="#152b42"/>
<text x="94" y="464" font-family="Arial" font-size="13" font-weight="700" fill="#acc0d6" text-anchor="start">SCREEN AREA</text>
